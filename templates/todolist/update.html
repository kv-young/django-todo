
{% extends "base.html" %}

{% block title %}Edit Task | TodoList{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto px-4 py-10 sm:py-16">

  <!-- Header -->
  <header class="mb-8">
    <p class="text-sm font-medium text-primary mb-2">
      YOUR PERSONAL WORKSPACE
    </p>
    <h1 class="text-4xl font-bold tracking-tight">
      Edit Task
    </h1>
    <p class="text-base-content/60 mt-2">
      Update your task details.
    </p>
  </header>

  <!-- Edit form -->
  <section class="card bg-base-100 border border-base-300 shadow-sm">
    <div class="card-body p-6 sm:p-8">

      <form method="post" class="flex flex-col gap-6">
        {% csrf_token %}

        <!-- Task title -->
        <div class="form-control">
          <label for="title" class="label">
            <span class="label-text font-medium">Task title</span>
          </label>

          <input
            type="text"
            id="title"
            name="title"
            value="{{ task.title }}"
            placeholder="What needs to be done?"
            class="input input-bordered w-full"
            maxlength="255"
            required
          />
        </div>

        <!-- Completion status -->
        <div class="form-control">
          <label class="label cursor-pointer justify-start gap-3">
            <input
              type="checkbox"
              name="completed"
              class="checkbox checkbox-primary"
              {% if task.completed %}checked{% endif %}
            />
            <span class="label-text">Mark as completed</span>
          </label>
        </div>

        <!-- Actions -->
        <div class="flex flex-col-reverse sm:flex-row gap-3 pt-2">
          <a href="{% url 'home' %}" class="btn btn-ghost flex-1">
            Cancel
          </a>

          <button type="submit" class="btn btn-primary flex-1">
            Save changes
          </button>
        </div>
      </form>

    </div>
  </section>

</div>
{% endblock content %}
