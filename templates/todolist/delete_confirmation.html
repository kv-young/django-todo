
{% extends "base.html" %}

{% block title %}Delete Task | TodoList{% endblock %}

{% block content %}
<div class="max-w-3xl mx-auto px-4 py-16 sm:py-24">

  <div class="card bg-base-100 border border-base-300 shadow-sm">
    <div class="card-body items-center text-center p-8">

      <!-- Warning icon -->
      <div class="flex items-center justify-center size-16 rounded-full bg-error/10 text-error mb-2">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          class="size-8"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="1.8"
          aria-hidden="true"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M12 9v3.75m0 3h.008M10.29 3.86 1.82 18.1A1.5 1.5 0 0 0 3.11 20.4h17.78a1.5 1.5 0 0 0 1.29-2.3L13.71 3.86a1.99 1.99 0 0 0-3.42 0Z"
          />
        </svg>
      </div>

      <h1 class="text-2xl font-bold">Delete this task?</h1>

      <p class="text-base-content/60 mt-2">
        Are you sure you want to delete this task?
        This action cannot be undone.
      </p>

      <!-- Task preview -->
      <div class="w-full bg-base-200 rounded-box p-4 my-4 text-left">
        <p class="text-xs uppercase tracking-wide text-base-content/50 mb-1">
          Task to delete
        </p>
        <p class="font-medium wrap-break-words">
          {{ task.title }}
        </p>
      </div>

      <!-- Confirmation actions -->
      <div class="flex flex-col-reverse sm:flex-row gap-3 w-full">
        <a href="{% url 'home' %}" class="btn btn-ghost flex-1">
          Cancel
        </a>

        <form method="post" class="flex-1">
          {% csrf_token %}
          <button type="submit" class="btn btn-error w-full">
            Delete task
          </button>
        </form>
      </div>

    </div>
  </div>

</div>
{% endblock content %}
